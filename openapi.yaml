openapi: 3.0.3
info:
  title: Nodal AI Agent HTTP API
  version: 1.0.0
  description: |
    Thin HTTP client over the Nodal AI PayFi Agent API.

    Endpoints require Bearer-token authentication (ADMIN_API_TOKEN or
    WEBHOOK_SECRET) unless otherwise noted. On mainnet, unauthenticated
    requests are always rejected.
servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.nodal-ai.example.com
    description: Production server
tags:
  - name: health
    description: Health-check and dependency probes
  - name: spending
    description: Spending window and limit queries
  - name: approvals
    description: Human-in-the-loop task approvals
  - name: admin
    description: Agent lifecycle controls (pause/resume)
  - name: results
    description: Persisted task results
  - name: stream
    description: Server-sent events for real-time updates
  - name: metrics
    description: Prometheus metrics
paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      description: |
        Reports the reachability of Horizon, Soroban RPC and the database.
        Returns 200 when all components are up, 503 when any is degraded.
      operationId: getHealth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: All dependencies reachable
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: One or more dependencies degraded
  /status:
    get:
      tags: [results]
      summary: Persisted task results
      description: |
        Returns paginated persisted AgentResult records, newest first.
        Requires Bearer-token authentication when ADMIN_API_TOKEN is set.
      operationId: getStatus
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Maximum number of results to return
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of results to skip
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
          description: Paginated results
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
  /spending:
    get:
      tags: [spending]
      summary: Spending window status
      description: |
        Returns cumulative spend within the rolling window, per-asset usage
        and the configured limit. Requires Bearer-token authentication.
      operationId: getSpending
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendingResponse'
          description: Spending window status
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
  /metrics:
    get:
      tags: [metrics]
      summary: Prometheus metrics
      description: |
        Returns Prometheus text exposition format by default, or a JSON
        snapshot when the Accept header is application/json.
        Requires a configured API token and strict Bearer authentication.
      operationId: getMetrics
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Accept
          schema:
            type: string
            default: text/plain
          description: Response format (text/plain or application/json)
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
          description: Metrics payload
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
  /approvals:
    get:
      tags: [approvals]
      summary: List pending approvals
      description: |
        Returns all tasks currently awaiting a human approve/deny decision.
        Requires Bearer-token authentication.
      operationId: listApprovals
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalsResponse'
          description: Pending approvals
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Agent not available
  /approvals/{id}:
    post:
      tags: [approvals]
      summary: Approve or deny a pending task
      description: |
        Moves money, so a Bearer token is always required — even on testnet.
        The decision must be "approve" or "deny".
      operationId: decideApproval
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Pending approval id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDecisionResponse'
          description: Decision recorded
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Approval not found
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Agent not available
  /admin/pause:
    post:
      tags: [admin]
      summary: Pause the agent
      description: |
        Halts value-moving tasks. Requires strict Bearer authentication
        (a configured API token is mandatory).
      operationId: pauseAgent
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PauseResumeResponse'
          description: Agent paused
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
  /admin/resume:
    post:
      tags: [admin]
      summary: Resume the agent
      description: |
        Resumes value-moving tasks after a pause. Requires strict Bearer
        authentication (a configured API token is mandatory).
      operationId: resumeAgent
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PauseResumeResponse'
          description: Agent resumed
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
  /stream:
    get:
      tags: [stream]
      summary: Server-sent events stream
      description: |
        SSE stream emitting real-time updates for spending changes, approval
        status, agent pause/resume and heartbeats. Requires Bearer-token
        authentication.
      operationId: getStream
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: SSE event stream
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        ADMIN_API_TOKEN (or deprecated WEBHOOK_SECRET) sent as
        `Authorization: Bearer <token>`.
  schemas:
    HealthResponse:
      type: object
      required: [status, components]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: "ok when all dependencies are up, degraded otherwise"
        components:
          type: object
          required: [horizon, soroban, database]
          properties:
            horizon:
              type: string
              enum: [up, down]
            soroban:
              type: string
              enum: [up, down]
            database:
              type: string
              enum: [up, down]
      example:
        status: ok
        components:
          horizon: up
          soroban: up
          database: up

    StatusResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AgentResult'
      example:
        results: []

    SpendingResponse:
      type: object
      required: [total, limit, windowMs, percentUsed, usage]
      properties:
        total:
          type: number
          description: Cumulative spend within the window (in asset units)
        limit:
          type: number
          description: Configured spending limit (in asset units)
        windowMs:
          type: integer
          description: Rolling window duration in milliseconds
        percentUsed:
          type: number
          description: Percentage of the limit consumed
        usage:
          type: array
          description: Per-asset breakdown
          items:
            $ref: '#/components/schemas/SpendingUsage'
      example:
        total: 35.5
        limit: 100
        windowMs: 60000
        percentUsed: 35.5
        usage: []

    SpendingUsage:
      type: object
      required: [assetKey, spent, limit]
      properties:
        assetKey:
          type: string
          description: Canonical asset key (e.g. "XLM" or "USDC:ISSUER")
        spent:
          type: string
          description: Amount spent for this asset (7-decimal string)
        limit:
          type: string
          description: Limit for this asset, or "denied"

    MetricsResponse:
      type: object
      required: [llm, spending]
      properties:
        llm:
          type: object
          description: LLM usage metrics
        spending:
          type: object
          description: Spending window metrics
          properties:
            total:
              type: number
            limit:
              type: number
            percentUsed:
              type: number

    ApprovalsResponse:
      type: object
      required: [approvals]
      properties:
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/PendingApproval'

    PendingApproval:
      type: object
      required: [id, taskType, payload, amount, correlationId, createdAt, expiresAt]
      properties:
        id:
          type: string
        taskType:
          type: string
        payload:
          type: object
        amount:
          type: string
        correlationId:
          type: string
        createdAt:
          type: integer
          description: Timestamp in milliseconds
        expiresAt:
          type: integer
          description: Expiry timestamp in milliseconds

    ApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, deny]
          description: "approve to execute, deny to reject"

    ApprovalDecisionResponse:
      type: object
      required: [approval]
      properties:
        approval:
          $ref: '#/components/schemas/PendingApproval'
        result:
          $ref: '#/components/schemas/AgentResult'

    PauseResumeResponse:
      type: object
      required: [paused]
      properties:
        paused:
          type: boolean
          description: true when paused, false when resumed

    AgentResult:
      type: object
      required: [success, taskType]
      properties:
        success:
          type: boolean
        taskType:
          type: string
        data:
          type: object
          description: Task-specific result data
        error:
          type: string
        errorType:
          type: string
        correlationId:
          type: string
        durationMs:
          type: number
        sequenceIndex:
          type: integer

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
  examples: []
