version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    assignees:
      - "Dami24-hub"
    reviewers:
      - "Dami24-hub"
    groups:
      stellar-packages:
        patterns:
          - "@stellar/*"
          - "@stellar-sdk/*"
          - "stellar-sdk"
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/contracts/escrow"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    assignees:
      - "Dami24-hub"
    reviewers:
      - "Dami24-hub"
    groups:
      soroban-packages:
        patterns:
          - "soroban-sdk"
          - "soroban-sdk-macros"
          - "soroban-auth"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    assignees:
      - "Dami24-hub"
    reviewers:
      - "Dami24-hub"

