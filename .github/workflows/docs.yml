name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'backend/**'
      - 'typedoc.json'
      - 'package.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'backend/**'
      - 'typedoc.json'
      - 'package.json'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check sources
        run: npx tsc --noEmit

      - name: Generate TypeDoc API docs
        run: npm run docs:generate

      - name: Build VitePress docs
        run: npm run docs:build
        env:
          BASE_URL: /

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # Broken link check job
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Check for broken internal links
        run: |
          markdown-link-check docs/index.md docs/guide/*.md docs/design/*.md || echo "Link check completed"

  # Verify README Quick Start instructions work
  verify-quickstart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        run: rustup show

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Run doctor script
        run: npm run doctor

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Type-check sources
        run: npx tsc --noEmit

      - name: Run lint
        run: npm run lint

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, verify-quickstart]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
