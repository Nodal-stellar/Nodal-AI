name: Nightly x402 E2E — Testnet Interop

# ─── Triggers ─────────────────────────────────────────────────────────────────
# Primary: nightly at 02:00 UTC so it runs before European business hours.
# Manual: workflow_dispatch for on-demand runs (e.g. after a hotfix).
on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC every day
  workflow_dispatch:        # manual trigger from GitHub Actions UI

permissions:
  contents: write           # create/update the failure issue
  issues:   write           # open/update failure tracking issue

jobs:
  x402-roundtrip:
    name: x402 v2 round-trip against testnet facilitator
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      STELLAR_NETWORK:      testnet
      HORIZON_URL:          https://horizon-testnet.stellar.org
      SOROBAN_RPC_URL:      https://soroban-testnet.stellar.org
      # Funded testnet accounts are provisioned by Friendbot inside the test;
      # a placeholder secret is supplied so config validation passes before
      # the test overwrites it with the Friendbot-funded keypair.
      AGENT_SECRET_KEY:     ${{ secrets.E2E_AGENT_SECRET_KEY }}
      X402_ASSET_CODE:      USDC
      X402_ASSET_ISSUER:    ${{ secrets.E2E_USDC_ISSUER }}
      AGENT_SPENDING_LIMIT: "100"
      MAX_X402_PAYMENTS_PER_MINUTE: "60"
      DB_PATH:              ":memory:"
      LOG_LEVEL:            info
      # Public testnet USDC Circle issuer (testnet anchor)
      E2E_USDC_ISSUER:      ${{ secrets.E2E_USDC_ISSUER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TypeScript type-check and lint before spending testnet funds
      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Run only the x402 round-trip e2e test suite (excludes other e2e tests)
      - name: Run x402 round-trip e2e tests
        id: e2e
        run: npx vitest run tests/e2e/x402_roundtrip.test.ts
        continue-on-error: true  # collect result before deciding to open issue

      # ── Failure tracking: open/update a GitHub issue on failure ─────────────
      - name: Create or update failure issue on test failure
        if: steps.e2e.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔴 Nightly x402 E2E failing — ' + new Date().toISOString().slice(0, 10);
            const body = [
              '## Nightly x402 E2E test failed',
              '',
              `**Run:** [${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `**Branch:** \`${context.ref}\``,
              `**Date:** ${new Date().toISOString()}`,
              '',
              'The nightly x402 interop test against the Stellar testnet failed.',
              'Please investigate and resolve before the next nightly run.',
              '',
              '### Common causes',
              '- Testnet facilitator downtime',
              '- Testnet USDC issuer changed',
              '- x402 protocol version mismatch',
              '- Friendbot rate limiting',
            ].join('\n');

            // Search for an existing open failure issue to update rather than
            // creating duplicates for every nightly failure.
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'nightly-e2e-failure',
            });

            if (issues.length > 0) {
              // Update the most recent open failure issue with a new comment
              await github.rest.issues.createComment({
                owner:    context.repo.owner,
                repo:     context.repo.repo,
                issue_number: issues[0].number,
                body: `Still failing — run [${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) on ${new Date().toISOString().slice(0, 10)}`,
              });
            } else {
              // Open a fresh issue
              await github.rest.issues.create({
                owner:  context.repo.owner,
                repo:   context.repo.repo,
                title,
                body,
                labels: ['nightly-e2e-failure', 'bug'],
              });
            }

      # Fail the job after the issue-creation step so CI status is red
      - name: Propagate test failure
        if: steps.e2e.outcome == 'failure'
        run: exit 1
name: E2E

# End-to-end tests against a local stellar/quickstart network (#825).
#
# tests/e2e/* used to run only by hand against testnet, so the escrow round
# trip — exactly the test that catches integration breakage between the
# contract and the SDK — never gated a merge. This job boots quickstart from
# the `test-only` docker-compose profile (no agent HTTP server needed) and runs
# the suite against it.
#
# Kept in its own workflow rather than ci.yml so its path filter and nightly
# schedule do not change when ci.yml's jobs run (ci.yml's `mutation` job treats
# any scheduled run as its weekly backstop).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'backend/**'
      - 'contracts/**'
      - 'tests/e2e/**'
      - 'docker-compose.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  # Nightly: catches breakage from a new stellar/quickstart image or upstream
  # protocol change even when no PR touched the code.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (stellar/quickstart)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RUN_E2E: 'true'
      E2E_REQUIRE_WASM: 'true'
      HORIZON_URL: http://localhost:8000
      SOROBAN_RPC_URL: http://localhost:8000/soroban/rpc
      E2E_NETWORK_PASSPHRASE: 'Standalone Network ; February 2017'
      E2E_FRIENDBOT_URL: http://localhost:8000/friendbot
      # docker compose interpolates the whole file, and the `agent` service
      # marks these as required. The agent is not started here, so any
      # non-empty placeholder satisfies the interpolation.
      AGENT_SECRET_KEY: unused-by-e2e
      X402_ASSET_ISSUER: unused-by-e2e

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pull/boot quickstart first: it is the slowest step, so it warms up
      # while the WASM and node_modules are prepared below.
      - name: Start stellar/quickstart (test-only profile)
        run: docker compose --profile test-only up -d stellar-quickstart

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # See ci.yml's test-rust job: rustup reads ./rust-toolchain.toml.
      - name: Install Rust
        run: rustup show

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/escrow/target
          key: e2e-cargo-${{ runner.os }}-${{ hashFiles('contracts/escrow/Cargo.lock') }}

      - name: Build escrow WASM
        run: cargo build --locked --manifest-path contracts/escrow/Cargo.toml --target wasm32-unknown-unknown --release

      - run: npm ci

      # The compose healthcheck only covers Horizon; Friendbot and Soroban RPC
      # come up later, and the tests need both.
      - name: Wait for quickstart (Horizon, Friendbot, Soroban RPC)
        run: |
          for i in $(seq 1 60); do
            horizon=$(curl -s -o /dev/null -w '%{http_code}' "$HORIZON_URL" || true)
            # Friendbot answers 400 without ?addr= once it is up.
            friendbot=$(curl -s -o /dev/null -w '%{http_code}' "$E2E_FRIENDBOT_URL" || true)
            rpc=$(curl -s -X POST "$SOROBAN_RPC_URL" -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' || true)
            if [ "$horizon" = "200" ] && [[ "$friendbot" =~ ^[24] ]] && [[ "$rpc" == *'"healthy"'* ]]; then
              echo "quickstart ready after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "quickstart did not become ready in time" >&2
          docker compose logs stellar-quickstart | tail -100
          exit 1

      # The escrow suite is self-contained (it funds its own accounts through
      # quickstart's Friendbot). The x402 round trip is not run here yet: it
      # drives PayFiAgent, whose config only accepts testnet/mainnet/futurenet
      # passphrases, so it cannot sign for a standalone network.
      - name: Run E2E tests
        run: npm run test:e2e:escrow

      - name: Quickstart logs on failure
        if: failure()
        run: docker compose logs stellar-quickstart | tail -200

      - name: Stop quickstart
        if: always()
        run: docker compose --profile test-only down -v
