[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodal-ai-client"
version = "1.0.0"
description = "Thin Python client over the Nodal AI Agent HTTP API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Nodal AI Contributors", email = "contributors@nodal-ai.example.com" },
]
keywords = ["stellar", "payfi", "x402", "agent", "client", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
langchain = ["langchain>=0.1.0"]
dev = ["pytest>=7.0", "responses>=0.23", "black", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nodal_ai_client*"]

[tool.setuptools.package-data]
nodal_ai_client = ["py.typed"]
